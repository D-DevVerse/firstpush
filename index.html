    <title>SignUp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Sign Up</h2>
    <form class="F" id="signup">

        <input class="in" type="password" id="confirm" placeholder="Enter Confirm Password">
        <button class="but">submit</button>
    </form>
    <script src="main.js"></script>
</body>
